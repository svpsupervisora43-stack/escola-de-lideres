<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escola de Líderes - Animateams</title>
    <style>
      /* RESET & BASE */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0f172a; /* Fundo Slate Escuro */
        color: #f8fafc;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        padding: 30px 20px;
        display: flex;
        justify-content: center;
      }
      .app-container {
        max-width: 1000px;
        width: 100%;
      }

      /* CABEÇALHO */
      .header {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px 30px;
        margin-bottom: 24px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }
      .badge-sub {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .header h1 {
        font-size: 28px;
        font-weight: 800;
        color: #ffffff;
      }
      .header p {
        color: #94a3b8;
        font-size: 14px;
        margin-top: 4px;
      }

      /* BARRA DE BOTÕES (TABS) */
      .tabs-container {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .tab-btn {
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .tab-btn:hover {
        background: #334155;
        color: #ffffff;
      }
      .tab-btn.active {
        background: #38bdf8;
        color: #0f172a;
        border-color: #38bdf8;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      }

      /* PAINEL DE CONTEÚDO */
      .content-panel {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        animation: fadeIn 0.3s ease-in-out;
      }

      .panel-header {
        border-bottom: 1px solid #334155;
        padding-bottom: 16px;
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .panel-title {
        font-size: 22px;
        color: #f59e0b;
        font-weight: 700;
      }

      /* GRID INTERNO */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
      }
      .card h3 {
        font-size: 15px;
        color: #38bdf8;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .card ul {
        list-style: none;
      }
      .card ul li {
        position: relative;
        padding-left: 20px;
        margin-bottom: 10px;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.5;
      }
      .card ul li::before {
        content: "•";
        color: #f59e0b;
        font-weight: bold;
        font-size: 18px;
        position: absolute;
        left: 0;
        top: -2px;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .tag {
        background: #1e293b;
        border: 1px solid #334155;
        color: #f8fafc;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- Cabeçalho -->
      <div class="header">
        <span class="badge-sub">Animateams v6.3.0 · Via Parque</span>
        <h1>Escola de Líderes</h1>
        <p>
          Selecione um cargo para visualizar os requisitos, atribuições e
          material de apoio.
        </p>
      </div>

      <!-- Botões dos Cargos -->
      <div class="tabs-container">
        <button class="tab-btn active" onclick="carregarCargo('midia')">
          Mídia
        </button>
        <button class="tab-btn" onclick="carregarCargo('recepcao')">
          Recepcionista
        </button>
        <button class="tab-btn" onclick="carregarCargo('lider')">Líder</button>
        <button class="tab-btn" onclick="carregarCargo('supervisor')">
          Supervisor
        </button>
        <button class="tab-btn" onclick="carregarCargo('subgerente')">
          Subgerente
        </button>
      </div>

      <!-- Painel Exibido ao Clicar -->
      <div class="content-panel" id="painel-conteudo">
        <!-- Conteúdo injetado via JavaScript -->
      </div>
    </div>

    <script>
      // Banco de dados dos cargos
      const dadosCargos = {
        midia: {
          titulo: "Mídia & Comunicação de Pista",
          requisitos: [
            "Excelente comunicação verbal e dicção clara.",
            "Criatividade no engajamento e interação com famílias.",
            "Domínio das diretrizes de mídia e redes Animasom.",
            "Postura proativa para registro de momentos e eventos.",
          ],
          material: [
            "Manual de Comunicação Visual Animasom.",
            "Guia de Atividades do Clubinho WhatsApp.",
            "Treinamento de Redes Sociais e Atendimento ao Cliente.",
          ],
          integrantes: ["Lohana", "Equipe de Comunicação de Pista"],
        },
        recepcao: {
          titulo: "Recepcionista",
          requisitos: [
            "Atendimento encantador e acolhedor na entrada.",
            "Agilidade na operação de sistema de caixa e cadastros.",
            "Organização do fluxo de entrada e saída de crianças.",
            "Orientação clara aos pais sobre regras do parque.",
          ],
          material: [
            "Manual de Procedimentos de Check-in & Check-out.",
            "Treinamento de Encantamento e Atendimento Animasom.",
            "Guia de Resolução de Conflitos na Entrada.",
          ],
          integrantes: ["Pâmella", "Davi", "Eduarda"],
        },
        lider: {
          titulo: "Líder em Treinamento",
          requisitos: [
            "Liderança pelo exemplo durante a operação de pista.",
            "Capacidade de instruir e apoiar novos recreadores.",
            "Atenção rigorosa às normas de segurança dos brinquedos.",
            "Proatividade em momentos de pico de movimento.",
          ],
          material: [
            "Módulos Práticos de Liderança Animasom.",
            "Guia de Mediação de Conflitos Infantis.",
            "Rotinas de Apoio à Supervisão de Pista.",
          ],
          integrantes: ["Michelly Barbosa"],
        },
        supervisor: {
          titulo: "Supervisor",
          requisitos: [
            "Controle de insumos e organização de festas.",
            "Auditoria constante dos padrões operacionais da loja.",
            "Acompanhamento direto dos caixas e rotinas operacionais.",
            "Suporte direto à subgerência no turno.",
          ],
          material: [
            "Manual Interno de Inventário e Festas Animasom.",
            "Procedimentos de Abertura e Fechamento de Setor.",
            "Checklist de Auditoria Operacional.",
          ],
          integrantes: ["Ana Vitória dos Santos"],
        },
        subgerente: {
          titulo: "Subgerente (Dia / Noite)",
          requisitos: [
            "Gestão completa do turno (abertura/fechamento e caixa).",
            "Supervisão da escala, trocas e controle de faltas.",
            "Orientação e desenvolvimento contínuo da equipe.",
            "Garantia do padrão Animasom em todos os setores.",
          ],
          material: [
            "Livro: O Monge e o Executivo (James C. Hunter).",
            "Livro: A Única Coisa (Gary Keller).",
            "Trilha do Pipeline de Liderança Subgerencial.",
          ],
          integrantes: ["Thainá Freires (Dia)", "Felipe Mamedes (Noite)"],
        },
      };

      function carregarCargo(chave) {
        // Atualizar destaque dos botões
        const botoes = document.querySelectorAll(".tab-btn");
        botoes.forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");

        // Obter dados do cargo selecionado
        const cargo = dadosCargos[chave];

        // Montar HTML do painel
        const painel = document.getElementById("painel-conteudo");
        painel.innerHTML = `
        <div class="panel-header">
          <h2 class="panel-title">${cargo.titulo}</h2>
        </div>
        <div class="grid">
          <div class="card">
            <h3>📌 Requisitos & Competências</h3>
            <ul>
              ${cargo.requisitos.map((req) => `<li>${req}</li>`).join("")}
            </ul>
          </div>
          <div class="card">
            <h3>📚 Material de Apoio & Trilhas</h3>
            <ul>
              ${cargo.material.map((mat) => `<li>${mat}</li>`).join("")}
            </ul>
          </div>
        </div>
        <div class="card" style="margin-top: 20px;">
          <h3>👥 Integrantes Mapeados no Cargo</h3>
          <div class="tag-list">
            ${cargo.integrantes.map((nome) => `<span class="tag">${nome}</span>`).join("")}
          </div>
        </div>
      `;
      }

      // Carregar o primeiro cargo automaticamente ao abrir a página
      window.onload = () => {
        carregarCargo("midia");
      };
    </script>
  </body>
</html>
