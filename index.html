<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plano de Carreira e Trilhas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>🎯 Guia de Carreiras & Treinamentos</h1>
        <p>Selecione um cargo para ver os requisitos e materiais de apoio</p>
      </header>

      <nav class="menu-cargos">
        <button onclick="renderizarCargo('Mídia')">📱 Mídia</button>
        <button onclick="renderizarCargo('Recepcionista')">
          🛎️ Recepcionista
        </button>
        <button onclick="renderizarCargo('Líder')">👑 Líder</button>
        <button onclick="renderizarCargo('Supervisor')">📊 Supervisor</button>
        <button onclick="renderizarCargo('Subgerente')">⚙️ Subgerente</button>
      </nav>

      <main id="conteudo-cargo" class="painel-cargo">
        <p class="placeholder-texto">
          Clique em um dos cargos acima para visualizar os detalhes.
        </p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
